name: Linux AppImage
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        env:
          PYQUARK_VERSION: ${{ github.event.release.tag_name || github.sha }}
        run: scripts/build-appimage-compat.sh
      - name: Verify package
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" -w /workspace pyquark-appimage:ubuntu22.04 \
            bash -c 'scripts/verify-appimage.sh dist/PyQuark-*-x86_64.AppImage'
      - uses: actions/upload-artifact@v4
        with:
          name: PyQuark-x86_64
          path: |
            dist/*.AppImage
            dist/*.zsync
            dist/SHA256SUMS
            build/appimage-smoke/screenshot.png
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > /tmp/existing-assets
          for asset in dist/*.AppImage dist/*.zsync dist/SHA256SUMS; do
            if ! grep -Fxq "$(basename "$asset")" /tmp/existing-assets; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
